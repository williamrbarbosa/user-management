services:
  api:
    container_name: user_management_api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    image: postgres:16
    container_name: user_management_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: users_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: users_management_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:

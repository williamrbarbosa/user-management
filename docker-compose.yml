services:
  postgres:
    image: postgres:16
    restart: always
    container_name: user-management-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: user-management-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
